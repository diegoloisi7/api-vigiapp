services:
  postgres:
    image: postgres:17-alpine
    container_name: vigiapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-vigiapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vigiapp}
      POSTGRES_DB: ${DB_DATABASE:-vigiapp}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-vigiapp} -d ${DB_DATABASE:-vigiapp}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
