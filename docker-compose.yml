services:
  mariadb:
    image: mariadb:11.4
    container_name: vigiapp-mariadb
    restart: unless-stopped
    command: ['--default-time-zone=+00:00']
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-password}
      MARIADB_DATABASE: ${DB_DATABASE:-vigiapp}
      MARIADB_USER: ${DB_USERNAME:-vigiapp}
      MARIADB_PASSWORD: ${DB_PASSWORD:-vigiapp}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
